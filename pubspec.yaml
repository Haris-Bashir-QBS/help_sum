  flutter_rating_bar: ^4.0.1
  timelines_plus: ^1.0.7
  flutter_custom_month_picker: ^0.1.3
  google_maps_flutter: ^2.12.2
  intl: ^0.20.2
  # google_maps_place_picker_mb: ^3.1.2
  fluttertoast: ^8.2.12
  #beta Dependencies
  dio: ^5.8.0+1
  fpdart: ^1.1.1
  logger: ^2.6.0
  connectivity_plus: ^6.0.2
  flutter_spinkit: ^5.2.1
  get_it: ^8.2.0
  file_picker: ^9.2.2
  image_cropper: ^9.0.0
  image_picker: ^1.1.2
  socket_io_client: ^3.1.2
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  cherry_toast: ^1.13.0
  flutter_stripe: ^11.5.0
  flutter_slidable: ^4.0.0
  skeletonizer: ^1.0.0
  equatable: ^2.0.7
  extended_image: ^10.0.1
  shimmer: ^3.0.0
  webview_flutter: ^4.13.0
  geolocator: 14.0.2 
  device_info_plus: ^11.5.0
  permission_handler: ^12.0.1
  package_info_plus: ^8.3.0
  shorebird_code_push: ^2.0.4
  flutter_typeahead: ^5.2.0
  flutter_google_places_sdk: ^0.4.0
  change_app_package_name: ^1.5.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  dartz: ^0.10.1
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_local_notifications: ^19.4.2
  hugeicons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  riverpod_generator: ^2.3.6
  build_runner: ^2.5.4
  


flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/bottom/focused/
    - assets/icons/bottom/unfocused/
    - assets/images/
    - shorebird.yaml
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
        - asset: assets/fonts/Poppins-ThinItalic.ttf
        - asset: assets/fonts/Poppins-ExtraLight.ttf
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
        - asset: assets/fonts/Poppins-Light.ttf
        - asset: assets/fonts/Poppins-LightItalic.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-MediumItalic.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-BoldItalic.ttf
        - asset: assets/fonts/Poppins-ExtraBold.ttf
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
        - asset: assets/fonts/Poppins-Black.ttf
        - asset: assets/fonts/Poppins-BlackItalic.ttf
       
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/ic_app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
